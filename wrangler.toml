# Cloudflare Worker config for skynet-ctf.org. The dashboard's Git
# integration (ctf-skynet -> Settings -> Build) runs `npx wrangler deploy`
# on every push to main — this file is what that command actually reads.
# With no wrangler.toml present at all (the state this repo was in before
# this file existed), wrangler falls back to a zero-config "just serve
# this directory as static files" mode, which is what silently shipped
# instead of real answer-checking — see src/index.js's own top comment for
# the full story.
#
# name MUST stay exactly "ctf-skynet" — wrangler uses this to identify
# which existing Worker to update. A different name here would deploy a
# brand new Worker instead, orphaned from the skynet-ctf.org domain
# binding and everything else already configured on the real one.
name = "ctf-skynet"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV binding for the rate limiter (see src/index.js's checkRateLimit) —
# "ctf-rate-limit" namespace, real id below (not the display name; wrangler
# needs the id specifically). Has to stay above [assets] below: TOML scopes
# every key after a [table] header into that table, so this was briefly,
# incorrectly nested as assets.kv_namespaces instead of a top-level key
# when first added — caught by validating the parsed file, not by eye.
# src/index.js checks whether env.RATE_LIMIT exists before using it, so
# this was deliberately left out of the very first deploy of this file (an
# invalid/placeholder id would have made `wrangler deploy` fail outright)
# — filled in now that the real id is confirmed.
kv_namespaces = [
  { binding = "RATE_LIMIT", id = "f1f4b873efcf44eb86a83fc8ac9855ed" }
]

# directory = "dist" (not "." / repo root) — dist/ is generated by
# `npm run build` (see build/strip-comments.mjs), not committed to git,
# and holds only an explicit allowlist of stripped-of-comments files:
# index.html, console.html, styles/*, scripts/*, audio/*. Nothing else in
# this repo can ever end up in dist/, which is what replaced the old
# .assetsignore-based approach (an exclude-list off directory = ".") —
# this is an allowlist instead, so a new non-public file added later is
# safe by default rather than needing someone to remember to exclude it.
# Requires the Cloudflare dashboard's Build command (Settings -> Build,
# currently "None") to be set to `npm ci && npm run build` — without that,
# `wrangler deploy` runs against a dist/ that was never generated for this
# push and either fails or serves stale content from a previous build.
[assets]
directory = "dist"
binding = "ASSETS"
