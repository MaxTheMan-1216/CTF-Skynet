# Cloudflare Worker config for skynet-ctf.org, read by `wrangler deploy`
# on every push to main via the dashboard's Git integration.

# Must stay exactly "ctf-skynet" — wrangler uses this to identify which
# existing Worker to update; a different name deploys a brand new,
# unbound Worker instead.
name = "ctf-skynet"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV binding for the rate limiter (see src/index.js's checkRateLimit).
# Must stay above [assets] — TOML scopes keys after a [table] header
# into that table. src/index.js fails safe if this binding is missing.
kv_namespaces = [
  { binding = "RATE_LIMIT", id = "f1f4b873efcf44eb86a83fc8ac9855ed" }
]

# directory = "dist" (generated by `npm run build`, gitignored) not the
# repo root — an explicit allowlist of stripped files, not an exclude-list.
# Requires the Cloudflare dashboard's Build command set to
# `npm ci && npm run build`, or this deploys stale/missing assets.
[assets]
directory = "dist"
binding = "ASSETS"
