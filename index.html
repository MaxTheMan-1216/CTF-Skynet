<title>Skynet — Access Terminal</title>
<link rel="stylesheet" href="styles/theme.css">
<style>
  html, body { height: 100%; }

  .gate-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  /* faint signal-hiccup: a ~200ms jitter+flicker burst near the start of every
     10s loop, then flat for the rest — only runs once boot has fired */
  @media (prefers-reduced-motion: no-preference) {
    .gate-screen.play { animation: glitch 10.6s ease infinite; }
  }
  @keyframes glitch {
    0%, 100% { transform: translate(0, 0); filter: brightness(1) contrast(1); }
    0.5% { transform: translate(-2px, 1px); filter: brightness(1.15) contrast(1.25); }
    1% { transform: translate(2px, -1px); filter: brightness(0.9) contrast(1.15); }
    1.5% { transform: translate(-1px, 0); filter: brightness(1.08) contrast(1.15); }
    2% { transform: translate(0, 0); filter: brightness(1) contrast(1); }
  }

  /* ---------- emblem: three separate clip-path shapes with real gaps between them ---------- */
  .emblem {
    position: relative;
    width: clamp(200px, 42vw, 380px);
    aspect-ratio: 3 / 2;
    clip-path: inset(0 0 100% 0);
  }
  .tri {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom,
      var(--signal) 0px, var(--signal) 5px, transparent 5px, transparent 9px);
  }
  /* all three shapes are plotted in the same 0-100% box, so the gaps between
     them are just the space no polygon covers, not a shape drawn on top */
  .tri-left    { clip-path: polygon(32.76% 39.93%, 47.36% 66.97%, 47.36% 93.65%, 5.19% 93.65%); }
  .tri-right   { clip-path: polygon(65.99% 39.93%, 51.39% 66.97%, 51.39% 93.65%, 93.56% 93.65%); }
  .tri-diamond { clip-path: polygon(49.47% 9.62%, 63.02% 34.12%, 49.47% 60.80%, 35.93% 34.12%); }
  @keyframes emblem-reveal {
    to { clip-path: inset(0 0 0% 0); }
  }
  @keyframes emblem-glow {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50% { filter: drop-shadow(0 0 26px var(--signal-glow)); }
  }

  /* ---------- staged type reveal ---------- */
  .wordmark, .caption, .gate { opacity: 0; }

  .wordmark {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(38px, 10vw, 92px);
    letter-spacing: 0.05em;
    color: var(--phosphor);
    margin: 0.35em 0 0;
  }
  .caption {
    font-family: var(--font-mono);
    font-size: clamp(10px, 1.6vw, 14px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--signal-dim);
    margin: 0.7em 0 0;
  }
  @keyframes flicker-in {
    0%, 19%, 21%, 23% { opacity: 0; }
    20%, 22%, 100% { opacity: 1; }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* boot sequence is held until first interaction (see JS), then this block
     drives emblem/wordmark/caption/gate in — kept out of the reduced-motion
     path entirely so those users never get it, regardless of the .play class */
  @media (prefers-reduced-motion: no-preference) {
    .gate-screen.play .emblem {
      animation:
        emblem-reveal 1.38s cubic-bezier(.2, .7, .3, 1) forwards,
        emblem-glow 4.5s ease-in-out 2.75s infinite;
    }
    .gate-screen.play .wordmark { animation: flicker-in 0.63s steps(6, end) 1.31s forwards; }
    .gate-screen.play .caption { animation: fade-up 0.63s ease-out 1.88s forwards; }
    .gate-screen.play .gate { animation: fade-up 0.63s ease-out 2.31s forwards; }
  }

  @media (prefers-reduced-motion: reduce) {
    .emblem { clip-path: inset(0 0 0% 0); }
    .wordmark, .caption, .gate { opacity: 1; }
    .boot-prompt { display: none; animation: none; }
  }

  /* ---------- prompt ---------- */
  .gate-slot {
    display: grid;
    margin-top: clamp(28px, 6vw, 48px);
  }
  .gate-slot > * { grid-area: 1 / 1; }
  .gate { margin-top: 0; }
  .boot-prompt {
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--steel-dim);
    animation: blink 1.6s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .gate-screen.play .boot-prompt { display: none; }
  .gate-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--steel-dim);
    margin-bottom: 8px;
  }
  .gate-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: min(360px, 78vw);
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 8px;
  }
  .gate-row.ok { border-color: var(--cleared); }
  .gate-row.shake { animation: shake 0.35s ease; border-color: var(--signal); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .gate-caret { font-family: var(--font-mono); color: var(--signal); font-size: 16px; }
  .gate-row input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--phosphor);
    caret-color: var(--signal);
  }
  .gate-row input:focus { outline: none; }
  .gate-msg {
    min-height: 16px;
    margin: 8px 0 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--steel-dim);
  }
  .gate-msg.ok { color: var(--cleared); }
</style>

<main class="gate-screen">
  <div class="emblem" aria-hidden="true">
    <div class="tri tri-left"></div>
    <div class="tri tri-right"></div>
    <div class="tri tri-diamond"></div>
  </div>
  <h1 class="wordmark">SKYNET</h1>
  <p class="caption">Cyberdyne Systems Corporation</p>

  <div class="gate-slot">
    <p class="boot-prompt">Press any key to initialize</p>
    <form id="gate" class="gate" autocomplete="off">
      <label class="gate-label" for="gate-input">Authorization required</label>
      <div class="gate-row">
        <span class="gate-caret" aria-hidden="true">&gt;</span>
        <input id="gate-input" type="text" spellcheck="false" autocomplete="off" autofocus aria-describedby="gate-msg" />
      </div>
      <p id="gate-msg" class="gate-msg" role="status" aria-live="polite">&nbsp;</p>
    </form>
  </div>
</main>

<audio id="gate-audio" src="audio/Landing-Intro.mp3" loop preload="auto"></audio>

<script>
  // Extension point: swap this for the real puzzle answer once one is designed.
  const ACCESS_PHRASE = "no fate";

  const gate = document.getElementById("gate");
  const input = document.getElementById("gate-input");
  const row = gate.querySelector(".gate-row");
  const msg = document.getElementById("gate-msg");

  // Boot sequence + audio are both held until the first interaction, then
  // fired together — audio can't autoplay before that anyway (browser
  // policy), so the animation waits to match it rather than running ahead.
  const gateScreen = document.querySelector(".gate-screen");
  const gateAudio = document.getElementById("gate-audio");
  let booted = false;
  function beginBoot() {
    if (booted) return;
    booted = true;
    gateScreen.classList.add("play");
    gateAudio.play().catch(() => {});
  }
  document.addEventListener("click", beginBoot, { once: true });
  document.addEventListener("keydown", beginBoot, { once: true });

  gate.addEventListener("submit", e => {
    e.preventDefault();
    const answer = input.value.trim().toLowerCase();
    row.classList.remove("shake", "ok");

    if (answer && answer === ACCESS_PHRASE) {
      row.classList.add("ok");
      msg.classList.add("ok");
      msg.textContent = "ACCESS GRANTED — ROUTING TO NETWORK";
      setTimeout(() => { window.location.href = "console.html"; }, 700);
    } else {
      void row.offsetWidth; // restart the shake animation on back-to-back wrong guesses
      row.classList.add("shake");
      msg.classList.remove("ok");
      msg.textContent = "ACCESS DENIED — SEQUENCE REJECTED";
      input.select();
    }
  });
</script>
