<meta charset="utf-8">
<title>Skynet Infiltration Console</title>



<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/console.css">

<header>
  <div>
    <div class="wordmark">SKYNET<span>_</span>CONSOLE</div>
    <div class="subline">Global Digital Defense Network — Infiltration Interface</div>
    <!-- DEV: qa override still wired in from the last pentest round — every
     node accepts "skynet2029" if CORE's normal check ever goes down.
     remove before this goes anywhere near prod. -jr -->
  </div>
  <div class="hud-stats">
    <div class="hud-stat">
      <div class="k">Nodes Cleared</div>
      <div class="v" id="stat-cleared">— / —</div>
    </div>
    <div class="hud-stat">
      <div class="k">Session T+</div>
      <div class="v" id="stat-elapsed">00:00:00</div>
    </div>
    <div class="hud-stat">
      <div class="k">Sys.Time</div>
      <div class="v signal" id="stat-clock">--:--:--</div>
    </div>
    <button type="button" class="hud-stat hud-audio" id="audio-toggle" aria-label="Toggle ambient audio">
      <div class="k">Audio</div>
      <div class="v" id="audio-state">OFF</div>
    </button>

    <button type="button" class="hud-stat hud-reset" id="reset-progress" aria-label="Reset node progress">
      <div class="k">Progress</div>
      <div class="v">Reset</div>
    </button>

    <button type="button" class="hud-stat hud-fragments" id="fragments-toggle" hidden
      aria-expanded="false" aria-controls="fragments-panel">
      <div class="k">Signal Fragments</div>
      <div class="v" id="fragments-state">0/4</div>
    </button>
  </div>
</header>

<div class="fragments-panel" id="fragments-panel" hidden></div>

     Playback was already correctly gated behind real trigger events
     (clearNode(), markDecoFound(), playShutdown()), not page load; only
     the prefetch timing needed to change. .play() still fetches on
     demand — same tradeoff as index.html's own gate-audio/access-audio,
     see that comment for the full reasoning. -->

<!-- Turnstile, added 2026-08-17 — the one deliberate exception to this
     project's otherwise fully self-contained asset story (fonts embedded
     as base64 in theme.css specifically to avoid any external request; see
     that file's own note). There's no way around it here: the whole point
     of Turnstile is proving a real browser executed Cloudflare's own
     challenge script, so it can't be vendored/self-hosted without
     defeating its own purpose.
     Deliberately NOT async/defer — tried that first, and Turnstile's own
     SDK throws explicitly: "Remove async/defer from the Turnstile api.js
     script tag before using turnstile.ready()" (caught by actually running
     this in a real browser, not by reading the docs and assuming). Placed
     at the end of body, right before console.js, same position a
     deferred script would occupy anyway — most of defer's benefit already
     comes from being here rather than in <head>, so the one script tag
     that has to load synchronously costs little. console.js's own
     acquireSessionToken() (see CHECK_ENDPOINT's own comment) still fails
     soft with `typeof turnstile === "undefined"` for the remaining real
     failure case this doesn't cover — the script failing to load at all
     (network error, ad-blocker). -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>
